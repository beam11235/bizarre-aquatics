<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1408"/>
      <stop offset="100%" stop-color="#050a04"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6a3a"/>
      <stop offset="50%" stop-color="#222e1a"/>
      <stop offset="100%" stop-color="#4a6a3a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Plants -->
  <ellipse cx="40" cy="230" rx="15" ry="60" fill="rgba(20,80,50,0.5)" transform="rotate(-15,40,230)"/>
  <ellipse cx="360" cy="240" rx="12" ry="50" fill="rgba(20,80,50,0.4)" transform="rotate(12,360,240)"/>
  <ellipse cx="370" cy="260" rx="10" ry="40" fill="rgba(30,100,60,0.3)" transform="rotate(-8,370,260)"/>
  <!-- Sand -->
  <ellipse cx="200" cy="275" rx="190" ry="22" fill="rgba(160,130,80,0.3)"/>
  <!-- Eel body (sinuous S-curve path) -->
  <path d="M 30 200 Q 80 120 150 150 Q 220 180 280 130 Q 340 80 380 110" 
        fill="none" stroke="url(#body)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Pattern overlay -->
  <path d="M 30 200 Q 80 120 150 150 Q 220 180 280 130 Q 340 80 380 110" 
        fill="none" stroke="rgba(200,180,140,0.5)" stroke-width="22" stroke-linecap="round"
        stroke-dasharray="8,12" opacity="0.3"/>
  <!-- Dorsal fin -->
  <path d="M 60 180 Q 120 140 190 155 Q 250 165 310 130 Q 355 105 375 108" 
        fill="none" stroke="#4a6a3a" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="380" cy="112" rx="22" ry="14" fill="#4a6a3a" filter="url(#shadow)"/>
  <!-- Snout (elongated) -->
  <ellipse cx="400" cy="110" rx="12" ry="6" fill="#222e1a"/>
  <!-- Eye -->
  <circle cx="388" cy="107" r="4" fill="#111"/>
  <circle cx="386" cy="105" r="1.2" fill="rgba(255,255,255,0.7)"/>
  <!-- Pectoral fin -->
  <ellipse cx="362" cy="122" rx="10" ry="5" fill="#4a6a3a" opacity="0.6" transform="rotate(20,362,122)"/>
  <!-- Bubbles -->
  <circle cx="50" cy="80" r="5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="200" cy="50" r="3" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="320" cy="60" r="4" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Highlight -->
  <path d="M 80 165 Q 150 140 230 155" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>
</svg>