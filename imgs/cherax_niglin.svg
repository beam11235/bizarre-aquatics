<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#041808"/>
      <stop offset="100%" stop-color="#020c04"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a8855"/>
      <stop offset="100%" stop-color="#0a3a25"/>
    </radialGradient>
    <radialGradient id="claw" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#30cc88"/>
      <stop offset="100%" stop-color="#0a3a25"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bubbles -->
  <circle cx="60" cy="40" r="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="330" cy="70" r="4" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="80" cy="200" r="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="350" cy="220" r="5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Sand substrate -->
  <ellipse cx="200" cy="270" rx="180" ry="25" fill="rgba(180,150,100,0.3)"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="255" rx="90" ry="12" fill="rgba(0,0,0,0.35)"/>
  <!-- Antennae -->
  <line x1="155" y1="118" x2="60" y2="60" stroke="rgba(60,200,140,0.4)" stroke-width="1.5" opacity="0.8"/>
  <line x1="165" y1="115" x2="80" y2="50" stroke="rgba(60,200,140,0.4)" stroke-width="1.5" opacity="0.8"/>
  <line x1="245" y1="118" x2="340" y2="60" stroke="rgba(60,200,140,0.4)" stroke-width="1.5" opacity="0.8"/>
  <line x1="235" y1="115" x2="320" y2="50" stroke="rgba(60,200,140,0.4)" stroke-width="1.5" opacity="0.8"/>
  <!-- Small antennules -->
  <line x1="175" y1="118" x2="145" y2="95" stroke="rgba(60,200,140,0.4)" stroke-width="1" opacity="0.6"/>
  <line x1="225" y1="118" x2="255" y2="95" stroke="rgba(60,200,140,0.4)" stroke-width="1" opacity="0.6"/>
  <!-- Walking legs (left) -->
  <line x1="165" y1="175" x2="110" y2="210" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="185" x2="100" y2="225" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="158" y1="195" x2="105" y2="240" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="205" x2="115" y2="250" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Walking legs (right) -->
  <line x1="235" y1="175" x2="290" y2="210" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="185" x2="300" y2="225" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="242" y1="195" x2="295" y2="240" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="205" x2="285" y2="250" stroke="#0a3a25" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Main body (carapace + abdomen) -->
  <ellipse cx="200" cy="175" rx="65" ry="80" fill="url(#body)" filter="url(#shadow)"/>
  <!-- Carapace -->
  <ellipse cx="200" cy="150" rx="62" ry="50" fill="url(#body)"/>
  <!-- Head -->
  <ellipse cx="200" cy="120" rx="42" ry="30" fill="url(#body)"/>
  <!-- Rostrum -->
  <polygon points="200,90 190,110 210,110" fill="#1a8855" opacity="0.9"/>
  <!-- Tail fan (telson) -->
  <ellipse cx="200" cy="235" rx="45" ry="20" fill="url(#body)" opacity="0.85"/>
  <line x1="200" y1="215" x2="200" y2="255" stroke="rgba(60,200,140,0.4)" stroke-width="1.5" opacity="0.5"/>
  <line x1="190" y1="218" x2="175" y2="255" stroke="rgba(60,200,140,0.4)" stroke-width="1" opacity="0.4"/>
  <line x1="210" y1="218" x2="225" y2="255" stroke="rgba(60,200,140,0.4)" stroke-width="1" opacity="0.4"/>
  <!-- Segmentation lines on abdomen -->
  <line x1="150" y1="180" x2="250" y2="180" stroke="rgba(60,200,140,0.4)" stroke-width="0.8" opacity="0.3"/>
  <line x1="148" y1="195" x2="252" y2="195" stroke="rgba(60,200,140,0.4)" stroke-width="0.8" opacity="0.3"/>
  <line x1="150" y1="210" x2="250" y2="210" stroke="rgba(60,200,140,0.4)" stroke-width="0.8" opacity="0.3"/>
  <!-- Left claw -->
  <line x1="160" y1="135" x2="95" y2="140" stroke="#30cc88" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="82" cy="138" rx="18" ry="12" fill="url(#claw)" transform="rotate(-10,82,138)"/>
  <line x1="74" y1="133" x2="64" y2="127" stroke="#30cc88" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="142" x2="62" y2="148" stroke="#30cc88" stroke-width="3" stroke-linecap="round"/>
  <!-- Right claw -->
  <line x1="240" y1="135" x2="305" y2="140" stroke="#30cc88" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="318" cy="138" rx="18" ry="12" fill="url(#claw)" transform="rotate(10,318,138)"/>
  <line x1="326" y1="133" x2="336" y2="127" stroke="#30cc88" stroke-width="3" stroke-linecap="round"/>
  <line x1="326" y1="142" x2="338" y2="148" stroke="#30cc88" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="185" cy="110" r="5" fill="#111"/>
  <circle cx="215" cy="110" r="5" fill="#111"/>
  <circle cx="183" cy="108" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="213" cy="108" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <!-- Highlight on carapace -->
  <ellipse cx="185" cy="138" rx="20" ry="10" fill="rgba(255,255,255,0.08)" transform="rotate(-15,185,138)"/>
</svg>